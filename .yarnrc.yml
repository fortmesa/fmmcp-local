# Hermetic/offline install support (INV-HERMETIC):
# - enableGlobalCache: false → dependency zips live in the committed .yarn/cache,
#   so `yarn install --immutable` works with ZERO network (Docker builds, CI).
# - yarnPath pins the exact Yarn binary (same artifact as fm-supply-chain
#   artifacts/bin/yarn-4.12.0.cjs) so corepack never needs to download.
# Linker stays PnP (default) — runtime uses `yarn node dist/server/index.js`.
enableGlobalCache: false

yarnPath: .yarn/releases/yarn-4.12.0.cjs

supportedArchitectures:
  os:
    - linux
    - darwin
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

# `vsce package`'s bundled secret scanner (secretlint, invoked from
# @vscode/vsce's out/secretLint.js) resolves its rule/formatter packages by
# calling `require.resolve()` from **@secretlint/resolver's own module
# location** (see its `tryResolve()` — `createRequire(import.meta.url)`,
# where `import.meta.url` is always @secretlint/resolver's own file, never
# the caller's). @secretlint/resolver ships with zero declared runtime
# dependencies, so under strict PnP it has no visibility into the rule/
# formatter packages @vscode/vsce depends on and passes to it by bare name —
# `vsce package` fails with "Failed to load secretlint's rule module ... is
# not found" even though every package involved is already a real,
# already-cached dependency of @vscode/vsce (see yarn.lock). This is an
# upstream secretlint/vsce packaging gap (their integration assumes
# npm-style hoisting), not a version mismatch or missing dependency on our
# side — confirmed by tracing @vscode/vsce@3.9.2's out/secretLint.js,
# @secretlint/config-loader's loadPackagesFromConfigDescriptor, and
# @secretlint/resolver's tryResolve. Fix via packageExtensions: grant
# @secretlint/resolver visibility into the exact 3 packages it needs to
# `require.resolve()` for vsce's scan (the recommend preset, the no-dotenv
# rule, and the sarif formatter) — all three are already resolved into
# yarn.lock and cached in .yarn/cache as transitive deps of @vscode/vsce, so
# this adds zero new packages and requires zero network access; it only
# corrects a missing dependency edge. (The three sub-rule ids vsce also
# references — secretlint-rule-basicauth/privatekey/npm — do NOT need this:
# they're preset-recommend overrides read from its own bundled build, not
# independently `require.resolve()`d; see loadPackagesFromConfigDescriptor.)
packageExtensions:
  '@secretlint/resolver@*':
    dependencies:
      '@secretlint/secretlint-rule-preset-recommend': '^10.1.2'
      '@secretlint/secretlint-rule-no-dotenv': '^10.1.2'
      '@secretlint/secretlint-formatter-sarif': '^10.1.2'
